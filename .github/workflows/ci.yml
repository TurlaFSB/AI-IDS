name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (the version is in the trailing comment).
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install (hash-verified)
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install --no-deps -e .
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Type check
        run: mypy
      - name: Test
        run: pytest

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install (hash-verified)
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install --no-deps -e .
      - name: Static security analysis
        run: bandit -r src -ll
      - name: Dependency vulnerability audit
        run: pip-audit
      - name: Generate SBOM
        run: cyclonedx-py environment --of JSON -o sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json

  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install (hash-verified)
        run: |
          pip install --require-hashes -r requirements/dev.txt
          pip install --no-deps -e .
      - name: End-to-end reproduction on synthetic data (two seeded runs must agree exactly)
        run: ./scripts/reproduce_synthetic.sh "$RUNNER_TEMP/reproduce"

  lock-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned uv (hash-verified)
        run: pip install --require-hashes -r requirements/tools.txt
      - name: Lock files are up to date
        run: |
          ./scripts/lock.sh
          git diff --exit-code -- requirements

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pre-pull pinned base image (retry on registry throttling)
        run: |
          image="$(sed -n 's/^ARG PYTHON_IMAGE=//p' Dockerfile)"
          for attempt in 1 2 3 4; do
            docker pull "$image" && exit 0
            sleep $((attempt * 15))
          done
          exit 1
      - name: Build image
        run: docker build --tag ai-ids:ci .
      - name: Smoke test (read-only filesystem, non-root)
        run: |
          docker run --rm --read-only ai-ids:ci --version
          test "$(docker run --rm --entrypoint id ai-ids:ci -u)" = "10001"
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ai-ids:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
