openapi: 3.0.3
info:
  title: AI-IDS scoring service
  version: 0.1.0
  description: >
    Scores network flows with a calibrated intrusion detector. Authentication uses bearer keys with
    two scopes: the score key (scoring and reading) and the read key (reading only). TLS must be
    terminated by a reverse proxy in front of the service.
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema: {type: object, properties: {status: {type: string, example: ok}}}
  /readyz:
    get:
      summary: Readiness probe (a calibrated model is loaded)
      security: []
      responses:
        "200":
          description: Ready to score.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ready}
                  detector: {type: string}
  /openapi.yaml:
    get:
      summary: This specification
      security: []
      responses:
        "200": {description: The OpenAPI document.}
  /v1/score:
    post:
      summary: Score a batch of flows (requires the score key)
      description: >
        Each flow must contain every model feature as a finite number, or null for a missing value.
        Optional context fields (flow_id, source_ip, destination_ip, source_port, timestamp) are kept
        with alerts. Unknown fields are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flows]
              additionalProperties: false
              properties:
                flows:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    description: Feature name to number (or null), plus optional context fields.
                    additionalProperties: true
      responses:
        "200":
          description: One result per flow, in order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  model: {$ref: "#/components/schemas/ModelInfo"}
                  threshold: {type: number}
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        score: {type: number}
                        alert: {type: boolean}
                        category: {type: string}
                        attack_techniques: {type: array, items: {type: string}}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "413": {$ref: "#/components/responses/Error"}
        "415": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/alerts:
    get:
      summary: Most recent alerts, newest first (read or score key)
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        "200":
          description: Recent alerts from the bounded in-memory buffer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts: {type: array, items: {type: object, additionalProperties: true}}
        "401": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /v1/stats:
    get:
      summary: Counters, per-minute series and latency percentiles (read or score key)
      responses:
        "200": {description: Service statistics.}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /metrics:
    get:
      summary: Prometheus metrics (read or score key)
      responses:
        "200":
          description: Prometheus text exposition.
          content:
            text/plain: {schema: {type: string}}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  schemas:
    ModelInfo:
      type: object
      properties:
        detector: {type: string}
        n_features: {type: integer}
        threshold: {type: number}
        artifact_sha256: {type: string}
        signed: {type: boolean}
  responses:
    Error:
      description: Error response; messages never echo request values.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: {type: string}
                  message: {type: string}
